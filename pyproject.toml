[project]
name = "bolex"
version = "1.0.0"
description = "Bolex, a book face"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keaton Elvins" }]
dependencies = [
    "fonttools[repacker,ufo,woff]>=4.68",  # the repacker lays out the layout tables: every build needs the same one
    "numpy>=2.5",
    "skia-pathops>=0.9.2",
    "ttfautohint-py>=0.6.1",
    "ufo2ft>=3.10",
    "ufolib2>=0.19",
]

[project.urls]
Repository = "https://github.com/keatonelvins/bolex"

[project.scripts]
bolex = "bolex.build:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bolex"]

[tool.ruff]
line-length = 120
